<div class="auth">
  <div class="auth__card">
    <aside class="auth__hero">
      <p class="auth__brand">Rojin<span aria-hidden="true">.</span></p>
      <p class="auth__tag">Conversations worth keeping.</p>
      <span class="auth__rule" aria-hidden="true"></span>
    </aside>

    <div class="auth__body">
      <h1 class="auth__heading">Welcome back</h1>
      <p class="auth__sub">Sign in to your account.</p>

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="auth__form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput type="text" id="username" formControlName="username" autocomplete="username" />
          @if (signInForm.get('username')?.hasError('required')) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" id="password" formControlName="password" autocomplete="current-password" />
          @if (signInForm.get('password')?.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <button type="submit" mat-raised-button color="primary" class="auth__cta" [disabled]="!signInForm.valid">
          Sign in
        </button>

        <p class="auth__alt">New to Rojin? <a routerLink="/signup">Create an account</a></p>
      </form>
    </div>
  </div>
</div>
