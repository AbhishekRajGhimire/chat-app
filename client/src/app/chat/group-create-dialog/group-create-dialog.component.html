<div class="gdlg">
  <header class="gdlg__head">
    <span class="gdlg__eyebrow">New group</span>
    <h2 class="gdlg__title">Name your group</h2>
  </header>

  <input class="gdlg__input" [(ngModel)]="title" placeholder="Group name" maxlength="80" />

  <div class="gdlg__people-head">
    <span class="gdlg__label">Add people</span>
    @if (selected.size) {
      <span class="gdlg__count">{{ selected.size }} selected</span>
    }
  </div>
  <input class="gdlg__input gdlg__input--search" [(ngModel)]="search" placeholder="Search people…" />

  <div class="gdlg__people">
    @for (u of users; track u.username) {
      <button type="button" class="gdlg__person" [class.is-on]="isSelected(u.username)"
        (click)="toggle(u.username)">
        <app-avatar [name]="u.display_name" [seed]="u.username" [size]="30"></app-avatar>
        <span class="gdlg__name">{{ u.display_name }}</span>
        <span class="gdlg__tick" [class.on]="isSelected(u.username)" aria-hidden="true"></span>
      </button>
    }
    @if (!users.length) {
      <p class="gdlg__empty">No one matches.</p>
    }
  </div>

  <footer class="gdlg__actions">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" type="button" [disabled]="!canCreate" (click)="create()">
      Create group
    </button>
  </footer>
</div>
