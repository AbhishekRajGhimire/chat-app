<mat-toolbar color="primary" class="app-toolbar">
    <div class="app-toolbar__brand">
      <span class="app-toolbar__lockup">
        <span class="app-toolbar__name">Rojin</span><span class="app-toolbar__rest"> : the org chat</span>
      </span>
    </div>
    <span class="app-toolbar__spacer"></span>
    <span class="app-toolbar__user">Welcome, {{ currentUser }}</span>
    <button mat-raised-button color="warn" class="logout-button" (click)="logout()">
        Logout
    </button>
  </mat-toolbar>
  
  <div class="chats-section" [class.chat-detail-active]="!!selectedUser">
    <div class="chats-sidebar">
        <button mat-raised-button color="primary" class="click-search-button" (click)="showSearch()">
            New Chat
        </button>
        <h4 style="margin: 10px">Direct Messages</h4>
        <mat-list class="chat-users-list">
            <mat-list-item *ngFor="let user of chatUsers" (click)="selectUser(user)"
                [ngClass]="{ active: selectedUser === user }">
                <span *ngIf="user === currentUser">{{user}} (You)</span>
                <span *ngIf="user != currentUser">{{ user }}</span>
            </mat-list-item>
        </mat-list>
    </div>
  
    <div class="chat-and-search-panel">
        <ng-container *ngIf="!selectedUser">
            <div class="search-bar-container">
                <div class="search-bar">
                    <input matInput class="user-search" placeholder="Search registered users (online or offline)"
                        [(ngModel)]="searchInput" (input)="filterUsers()" />
                </div>
                <mat-list class="search-results">
                    <div *ngIf="!directoryLoaded" class="search-results__hint">
                        Loading contacts…
                    </div>
                    <div *ngIf="directoryLoaded && directoryUsers.length === 0" class="search-results__hint">
                        No other users registered yet.
                    </div>
                    <div *ngIf="directoryLoaded && directoryUsers.length > 0 && filteredUsers.length === 0 && searchInput.trim()" class="search-results__hint">
                        No user matches your search.
                    </div>
                    <mat-list-item *ngFor="let user of filteredUsers" (click)="selectUser(user)">
                        <span class="search-result-name">{{ user }}</span>
                        <span *ngIf="isUserOnline(user)" class="search-result-online">Online</span>
                    </mat-list-item>
                </mat-list>
            </div>
        </ng-container>
        <ng-container *ngIf="selectedUser">
            <div class="chat-header">
                <button type="button" mat-icon-button class="chat-back" (click)="backToInbox()" aria-label="Back to inbox">
                    <mat-icon>arrow_back</mat-icon>
                </button>
                <h2 class="chat-header__title">{{ selectedUser }}</h2>
                <span *ngIf="isUserOnline(selectedUser)" class="chat-header__presence">Online</span>
            </div>
            <div class="chat-container">
                <div class="message-thread">
                    <div
                        *ngFor="let message of chatHistory[selectedUser] || []"
                        class="message-row"
                        [ngClass]="message.from === currentUser ? 'message-row--sent' : 'message-row--received'">
                        <div
                            class="message-bubble"
                            [ngClass]="message.from === currentUser ? 'message-bubble--sent' : 'message-bubble--received'">
                            <div class="message-bubble__text">{{ message.message }}</div>
                            <div class="message-bubble__meta">
                                {{ message.from }} · {{ message.datetime }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="message-input">
                <input matInput [(ngModel)]="newMessage" placeholder="Type a message" />
                <button mat-raised-button color="primary" (click)="sendMessage()">
                    Send
                </button>
            </div>
        </ng-container>
    </div>
  </div>
