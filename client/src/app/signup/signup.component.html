<div class="auth">
  <div class="auth__card">
    <aside class="auth__hero">
      <p class="auth__brand">Rojin<span aria-hidden="true">.</span></p>
      <p class="auth__tag">Conversations worth keeping.</p>
      <span class="auth__rule" aria-hidden="true"></span>
    </aside>

    <div class="auth__body">
      <h1 class="auth__heading">Create your account</h1>
      <p class="auth__sub">Join your workspace on Rojin.</p>

      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="auth__form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput type="text" id="username" formControlName="username" autocomplete="username" />
          @if (signUpForm.get('username')?.hasError('required')) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" id="password" formControlName="password" autocomplete="new-password" />
          @if (signUpForm.get('password')?.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <button type="submit" mat-raised-button color="primary" class="auth__cta" [disabled]="!signUpForm.valid">
          Sign up
        </button>

        <p class="auth__alt">Already registered? <a routerLink="/signin">Sign in</a></p>
      </form>
    </div>
  </div>
</div>
