name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the dev environment (Node 24 / npm 11). package-lock.json is
          # generated by npm 11; Node 20's npm 10 reconciles it differently and
          # fails `npm ci` with spurious "missing from lock" errors.
          node-version: '24'
      - run: npm ci
      - run: npm run build
